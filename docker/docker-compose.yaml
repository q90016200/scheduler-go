  postgres:
    image: postgres:16
    restart: always
    container_name: postgres
    environment:
      POSTGRES_DB: schedule_go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Taipei
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - "./postgres/data:/var/lib/postgresql/data"
    networks:
      docker_bridge:
        ipv4_address: 172.28.0.5
