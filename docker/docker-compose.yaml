version: '3'
services:
  # mongo:
  #   image: mongo:4.2
  #   restart: always
  #   container_name: mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - "./db/mongo/data:/data/db"
  #     - "./db/mongo/config:/data/configdb"
  #     - "./db/mongo/vhost:/vhost"
  #   environment :
  #     - TZ=Asia/Taipei
  #   # network_mode: "host"
